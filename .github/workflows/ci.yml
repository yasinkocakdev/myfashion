name: CI

on:
  push:
    branches: [main, "improve/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install ffmpeg (media integration tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Restore
        run: dotnet restore MyFashion.slnx

      # Warnings are errors (Directory.Build.props), so this also fails on
      # NuGet audit findings: known-vulnerable packages break the build.
      - name: Build
        run: dotnet build MyFashion.slnx --no-restore -c Release

      - name: Test
        run: dotnet test --solution MyFashion.slnx --no-build -c Release
